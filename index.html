<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CREST (Capstone Research Electronic Storage and Tracking) — The official research repository of Wesleyan University Philippines CECT Department. Browse, discover, and submit capstone research papers across BSIT, BSCpE, and BSECE." />
    <meta name="keywords" content="Wesleyan University Philippines, CECT, College of Engineering and Computer Technology, BSIT, BSCpE, BSECE, Computer Engineering, Electronics Engineering, Information Technology, research repository, capstone" />
    <meta name="theme-color" content="#171717" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('crest_theme');
          if (saved) document.documentElement.setAttribute('data-theme', saved);
        } catch (e) {
          // ignore — falls back to the default scheme
        }
      })();
    </script>
    <title>CREST | Wesleyan University Philippines CECT Research Repository</title>
    <!-- Google Fonts: Fraunces (display serif) + Karla (body) + IBM Plex Mono (catalog data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,600;1,9..144,700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
